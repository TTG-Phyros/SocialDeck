services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "npm run db:push"
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql://socialdeck:socialdeck@mysql:3306/socialdeck
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /app/storage/uploads
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "npm run start"
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql://socialdeck:socialdeck@mysql:3306/socialdeck
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /app/storage/uploads
    volumes:
      - uploads-data:/app/storage/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "npm run worker"
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql://socialdeck:socialdeck@mysql:3306/socialdeck
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /app/storage/uploads
    volumes:
      - uploads-data:/app/storage/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_DATABASE: socialdeck
      MYSQL_USER: socialdeck
      MYSQL_PASSWORD: socialdeck
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data

volumes:
  mysql-data:
  redis-data:
  uploads-data:
